[build-system]
requires = [
    "scikit-build-core",
    "pybind11"
]
build-backend = "scikit_build_core.build"

[project]
name = "gstats"
version = "0.1.0"
description = "Statistics library written in C++ using pybind11"
readme = "README.md"
requires-python = ">=3.10"

[tool.scikit-build]
cmake.build-type = "Release"
